<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#faf5ec">
<title>เข้าสู่ระบบ — บันทึกรายรับ-รายจ่าย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Sarabun',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:#faf5ec;}
body::before{content:'';position:fixed;inset:-60%;z-index:0;background:radial-gradient(circle at 20% 25%,rgba(255,180,200,0.55)0%,transparent 45%),radial-gradient(circle at 80% 15%,rgba(180,220,255,0.55)0%,transparent 45%),radial-gradient(circle at 70% 80%,rgba(255,230,180,0.5)0%,transparent 45%),radial-gradient(circle at 15% 75%,rgba(200,235,200,0.5)0%,transparent 45%);animation:drift 20s ease-in-out infinite alternate;pointer-events:none;}
@keyframes drift{0%{transform:translate(0,0) rotate(0deg);}50%{transform:translate(30px,-20px) rotate(1deg);}100%{transform:translate(-15px,25px) rotate(-0.5deg);}}
.shape{position:fixed;border-radius:50%;opacity:0.12;z-index:0;pointer-events:none;}
.shape-1{width:300px;height:300px;background:#B67BC2;top:-80px;right:-60px;animation:f1 18s ease-in-out infinite;}
.shape-2{width:200px;height:200px;background:#378ADD;bottom:-40px;left:-50px;animation:f2 22s ease-in-out infinite;}
.shape-3{width:150px;height:150px;background:#1D9E75;top:50%;left:-30px;animation:f1 15s ease-in-out infinite reverse;}
@keyframes f1{0%,100%{transform:translate(0,0);}50%{transform:translate(20px,30px);}}
@keyframes f2{0%,100%{transform:translate(0,0);}50%{transform:translate(-15px,-25px);}}
.wrap{position:relative;z-index:1;width:100%;max-width:420px;padding:1.2rem;}
.card{background:rgba(255,255,255,0.82);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);border:0.5px solid rgba(255,255,255,0.7);border-radius:20px;padding:2.2rem 2rem;box-shadow:0 20px 60px rgba(120,100,140,0.12);animation:up 0.6s cubic-bezier(0.16,1,0.3,1) both;}
@keyframes up{0%{opacity:0;transform:translateY(30px) scale(0.96);}100%{opacity:1;transform:translateY(0) scale(1);}}
.logo{text-align:center;margin-bottom:1.8rem;}
.logo-icon{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#1D9E75,#27AE60);display:inline-flex;align-items:center;justify-content:center;font-size:30px;color:#fff;box-shadow:0 8px 24px rgba(29,158,117,0.3);margin-bottom:12px;}
.logo-t{font-size:22px;font-weight:600;color:#1a1a1a;}
.logo-s{font-size:13px;color:#8a8a88;margin-top:4px;}
.tabs{display:flex;gap:4px;background:rgba(0,0,0,0.04);border-radius:10px;padding:3px;margin-bottom:1.6rem;}
.tab{flex:1;padding:10px;text-align:center;border-radius:8px;border:none;background:transparent;cursor:pointer;font-size:15px;font-weight:500;color:#888;transition:all 0.25s;font-family:inherit;}
.tab.active{background:#fff;color:#1a1a1a;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.form{display:flex;flex-direction:column;gap:14px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:13px;font-weight:500;color:#555;}
.field input{padding:12px 14px;border:1px solid rgba(0,0,0,0.1);border-radius:10px;font-size:15px;color:#1a1a1a;background:rgba(255,255,255,0.7);outline:none;transition:border-color 0.2s,box-shadow 0.2s;font-family:inherit;}
.field input:focus{border-color:#B67BC2;box-shadow:0 0 0 3px rgba(182,123,194,0.12);}
.field input::placeholder{color:#bbb;}
.pw-w{position:relative;}.pw-w input{width:100%;padding-right:44px;}
.pw-t{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px;color:#999;padding:4px;transition:color 0.15s;}.pw-t:hover{color:#555;}
.extras{display:flex;align-items:center;justify-content:space-between;margin-top:2px;}
.rem{display:flex;align-items:center;gap:7px;font-size:13px;color:#777;cursor:pointer;}.rem input{width:16px;height:16px;accent-color:#B67BC2;cursor:pointer;}
.fgt{font-size:13px;color:#B67BC2;text-decoration:none;font-weight:500;cursor:pointer;}.fgt:hover{text-decoration:underline;}
.btn{margin-top:6px;padding:13px;border:none;border-radius:12px;background:linear-gradient(135deg,#1D9E75,#27AE60);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:transform 0.15s,box-shadow 0.2s;font-family:inherit;box-shadow:0 4px 16px rgba(29,158,117,0.3);position:relative;overflow:hidden;}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(29,158,117,0.4);}
.btn:active{transform:scale(0.98);}
.btn.loading{pointer-events:none;opacity:0.7;}
.btn .spinner{display:none;width:20px;height:20px;border:2.5px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;position:absolute;right:18px;top:50%;margin-top:-10px;}
.btn.loading .spinner{display:block;}
@keyframes spin{to{transform:rotate(360deg);}}
.msg{padding:10px 14px;border-radius:10px;font-size:13px;display:none;margin-bottom:10px;animation:mi 0.3s ease;}
.msg.error{background:#FAECE7;color:#993C1D;border:0.5px solid rgba(216,90,48,0.2);}
.msg.success{background:#E1F5EE;color:#085041;border:0.5px solid rgba(29,158,117,0.2);}
.msg.show{display:block;}
@keyframes mi{from{opacity:0;transform:translateY(-5px);}to{opacity:1;transform:translateY(0);}}
.pw-str{display:flex;gap:4px;margin-top:4px;}.pw-bar{flex:1;height:3px;border-radius:99px;background:rgba(0,0,0,0.06);transition:background 0.3s;}
.pw-bar.w{background:#E74C3C;}.pw-bar.m{background:#F39C12;}.pw-bar.s{background:#27AE60;}
.pw-txt{font-size:11px;margin-top:3px;}
.terms{font-size:11px;color:#aaa;text-align:center;margin-top:14px;line-height:1.5;}.terms a{color:#B67BC2;text-decoration:none;}.terms a:hover{text-decoration:underline;}
.forgot-head{text-align:center;margin-bottom:10px;}.forgot-icon{font-size:36px;margin-bottom:8px;}.forgot-t{font-size:15px;font-weight:500;color:#1a1a1a;}.forgot-s{font-size:13px;color:#888;margin-top:4px;}
.back-link{text-align:center;margin-top:14px;}.back-link a{font-size:13px;color:#B67BC2;cursor:pointer;text-decoration:none;}.back-link a:hover{text-decoration:underline;}
.footer{text-align:center;margin-top:20px;font-size:13px;color:#999;}.footer a{color:#1D9E75;font-weight:500;text-decoration:none;cursor:pointer;}.footer a:hover{text-decoration:underline;}
@media(max-width:480px){.wrap{padding:0.8rem;}.card{padding:1.6rem 1.3rem;border-radius:16px;}.logo-icon{width:56px;height:56px;font-size:26px;border-radius:15px;}.logo-t{font-size:20px;}.shape-3{display:none;}.extras{flex-direction:column;gap:8px;align-items:flex-start;}}
</style>
</head>
<body>
<div class="shape shape-1"></div>
<div class="shape shape-2"></div>
<div class="shape shape-3"></div>

<div class="wrap">
  <div class="card">
    <div class="logo">
      <div class="logo-icon">฿</div>
      <div class="logo-t">บันทึกรายรับ-รายจ่าย</div>
      <div class="logo-s">เข้าสู่ระบบเพื่อซิงค์ข้อมูลทุกอุปกรณ์</div>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">เข้าสู่ระบบ</button>
      <button class="tab" onclick="switchTab('register')">สมัครใหม่</button>
    </div>
    <div class="msg" id="msg"></div>

    <!-- Login -->
    <div id="f-login">
      <div class="form">
        <div class="field"><label>อีเมล</label><input type="email" id="le" placeholder="you@example.com" autocomplete="email" inputmode="email"></div>
        <div class="field"><label>รหัสผ่าน</label><div class="pw-w"><input type="password" id="lp" placeholder="รหัสผ่าน" autocomplete="current-password"><button class="pw-t" onclick="tpw('lp',this)" type="button">👁</button></div></div>
        <div class="extras"><label class="rem"><input type="checkbox" checked> จดจำฉันไว้</label><a class="fgt" onclick="switchTab('forgot')">ลืมรหัสผ่าน?</a></div>
        <button class="btn" id="bl" onclick="doLogin()">เข้าสู่ระบบ<div class="spinner"></div></button>
      </div>
    </div>

    <!-- Register -->
    <div id="f-register" style="display:none;">
      <div class="form">
        <div class="field"><label>ชื่อที่แสดง</label><input type="text" id="rn" placeholder="ชื่อของคุณ" autocomplete="name"></div>
        <div class="field"><label>อีเมล</label><input type="email" id="re" placeholder="you@example.com" autocomplete="email" inputmode="email"></div>
        <div class="field"><label>รหัสผ่าน</label><div class="pw-w"><input type="password" id="rp" placeholder="อย่างน้อย 6 ตัวอักษร" autocomplete="new-password" oninput="ckStr(this.value)"><button class="pw-t" onclick="tpw('rp',this)" type="button">👁</button></div><div class="pw-str"><div class="pw-bar" id="b1"></div><div class="pw-bar" id="b2"></div><div class="pw-bar" id="b3"></div><div class="pw-bar" id="b4"></div></div><div class="pw-txt" id="ptxt"></div></div>
        <div class="field"><label>ยืนยันรหัสผ่าน</label><div class="pw-w"><input type="password" id="rp2" placeholder="พิมพ์อีกครั้ง" autocomplete="new-password"><button class="pw-t" onclick="tpw('rp2',this)" type="button">👁</button></div></div>
        <button class="btn" id="br" onclick="doRegister()">สมัครสมาชิก<div class="spinner"></div></button>
        <div class="terms">การสมัครแสดงว่าคุณยอมรับ <a href="#">ข้อตกลงการใช้งาน</a> และ <a href="#">นโยบายความเป็นส่วนตัว</a></div>
      </div>
    </div>

    <!-- Forgot -->
    <div id="f-forgot" style="display:none;">
      <div class="form">
        <div class="forgot-head"><div class="forgot-icon">📧</div><div class="forgot-t">รีเซ็ตรหัสผ่าน</div><div class="forgot-s">กรอกอีเมลที่ใช้สมัคร เราจะส่งลิงก์ให้</div></div>
        <div class="field"><label>อีเมล</label><input type="email" id="fe" placeholder="you@example.com" inputmode="email"></div>
        <button class="btn" id="bf" onclick="doForgot()">ส่งลิงก์รีเซ็ต<div class="spinner"></div></button>
        <div class="back-link"><a onclick="switchTab('login')">← กลับหน้าเข้าสู่ระบบ</a></div>
      </div>
    </div>

    <div class="footer" id="footer">ยังไม่มีบัญชี? <a onclick="switchTab('register')">สมัครเลย</a></div>
  </div>
</div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://jljoootcqddcixmwmtxl.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impsam9vb3RjcWRkY2l4bXdtdHhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2MjYwNzMsImV4cCI6MjA5MjIwMjA3M30.4NdR9pFjE_ILaAWoWlJOJFNae1pnP1CWkmtot6ooDZw';
const sb=window.supabase.createClient(SB_URL,SB_KEY);

(async()=>{const{data:{session}}=await sb.auth.getSession();if(session)window.location.href='budget_tracker_thai.html';})();

let ct='login';
function switchTab(t){ct=t;hideMsg();
  document.getElementById('f-login').style.display=t==='login'?'':'none';
  document.getElementById('f-register').style.display=t==='register'?'':'none';
  document.getElementById('f-forgot').style.display=t==='forgot'?'':'none';
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',(t==='login'&&i===0)||((t==='register')&&i===1)));
  const f=document.getElementById('footer');
  if(t==='login')f.innerHTML='ยังไม่มีบัญชี? <a onclick="switchTab(\'register\')">สมัครเลย</a>';
  else if(t==='register')f.innerHTML='มีบัญชีแล้ว? <a onclick="switchTab(\'login\')">เข้าสู่ระบบ</a>';
  else f.innerHTML='<a onclick="switchTab(\'login\')">← กลับหน้าเข้าสู่ระบบ</a>';
}
function tpw(id,btn){const i=document.getElementById(id);if(i.type==='password'){i.type='text';btn.textContent='🔒';}else{i.type='password';btn.textContent='👁';}}
function showMsg(t,ty){const e=document.getElementById('msg');e.textContent=t;e.className='msg '+ty+' show';}
function hideMsg(){document.getElementById('msg').className='msg';}
function ckStr(pw){const bars=[document.getElementById('b1'),document.getElementById('b2'),document.getElementById('b3'),document.getElementById('b4')];const txt=document.getElementById('ptxt');bars.forEach(b=>b.className='pw-bar');if(!pw.length){txt.textContent='';return;}let s=0;if(pw.length>=6)s++;if(pw.length>=10)s++;if(/[A-Z]/.test(pw)&&/[a-z]/.test(pw))s++;if(/[0-9]/.test(pw))s++;if(/[^A-Za-z0-9]/.test(pw))s++;s=Math.min(4,s);const lv=[{c:'w',t:'อ่อนมาก',cl:'#E74C3C'},{c:'w',t:'อ่อน',cl:'#E74C3C'},{c:'m',t:'ปานกลาง',cl:'#F39C12'},{c:'s',t:'แข็งแรง',cl:'#27AE60'},{c:'s',t:'แข็งแรงมาก',cl:'#1D9E75'}][s];for(let i=0;i<s;i++)bars[i].classList.add(lv.c);txt.textContent=lv.t;txt.style.color=lv.cl;}
function vEmail(e){return/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);}
function setL(id,on){const b=document.getElementById(id);b.classList.toggle('loading',on);b.disabled=on;}
function thErr(msg){if(!msg)return'เกิดข้อผิดพลาด';const m=msg.toLowerCase();if(m.includes('invalid login'))return'อีเมลหรือรหัสผ่านไม่ถูกต้อง';if(m.includes('email not confirmed'))return'กรุณายืนยันอีเมลก่อน (ตรวจสอบกล่องจดหมาย)';if(m.includes('already registered'))return'อีเมลนี้ถูกใช้สมัครแล้ว';if(m.includes('rate limit'))return'คำขอบ่อยเกินไป กรุณารอสักครู่';if(m.includes('password'))return'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';if(m.includes('email'))return'รูปแบบอีเมลไม่ถูกต้อง';return msg;}

async function doLogin(){hideMsg();const email=document.getElementById('le').value.trim(),pw=document.getElementById('lp').value;if(!email||!pw){showMsg('กรุณากรอกอีเมลและรหัสผ่าน','error');return;}if(!vEmail(email)){showMsg('รูปแบบอีเมลไม่ถูกต้อง','error');return;}setL('bl',true);const{data,error}=await sb.auth.signInWithPassword({email,password:pw});setL('bl',false);if(error){showMsg(thErr(error.message),'error');return;}showMsg('เข้าสู่ระบบสำเร็จ! กำลังนำทาง...','success');setTimeout(()=>window.location.href='budget_tracker_thai.html',800);}

async function doRegister(){hideMsg();const name=document.getElementById('rn').value.trim(),email=document.getElementById('re').value.trim(),pw=document.getElementById('rp').value,pw2=document.getElementById('rp2').value;if(!name){showMsg('กรุณากรอกชื่อ','error');return;}if(!email||!vEmail(email)){showMsg('กรุณากรอกอีเมลที่ถูกต้อง','error');return;}if(pw.length<6){showMsg('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร','error');return;}if(pw!==pw2){showMsg('รหัสผ่านไม่ตรงกัน','error');return;}setL('br',true);const{data,error}=await sb.auth.signUp({email,password:pw,options:{data:{display_name:name}}});setL('br',false);if(error){showMsg(thErr(error.message),'error');return;}if(data.user){await sb.from('user_settings').upsert({id:data.user.id,display_name:name,font:1,size:3,dark_mode:false,sound:true,savings_goal:0}).select();}if(data.user&&!data.session){showMsg('สมัครสำเร็จ! กรุณาตรวจสอบอีเมลเพื่อยืนยันบัญชี','success');}else if(data.session){showMsg('สมัครสำเร็จ! กำลังนำทาง...','success');setTimeout(()=>window.location.href='budget_tracker_thai.html',800);}}

async function doForgot(){hideMsg();const email=document.getElementById('fe').value.trim();if(!email||!vEmail(email)){showMsg('กรุณากรอกอีเมลที่ถูกต้อง','error');return;}setL('bf',true);const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+'/login.html'});setL('bf',false);if(error){showMsg(thErr(error.message),'error');return;}showMsg('ส่งลิงก์รีเซ็ตไปที่อีเมลแล้ว!','success');}

document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(ct==='login')doLogin();else if(ct==='register')doRegister();else if(ct==='forgot')doForgot();}});
</script>
</body>
</html>
